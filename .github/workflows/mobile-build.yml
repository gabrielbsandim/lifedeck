name: Mobile build

# Manual, because a native build is only needed when an OTA cannot carry the
# change: a new native module, a permission, the icon or splash, an SDK bump, or
# the very first install on a device.
#
# Android `preview` produces an APK that installs straight from the EAS link.
# iOS needs a paid Apple Developer account and each test device registered with
# `eas device:create`; without that the build fails at the credentials step.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: eas.json build profile
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: Submit to the store after building (production only)
        type: boolean
        default: false

concurrency:
  group: mobile-build-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Expo token
        id: guard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. Add it under Settings, Secrets and" \
              "variables, Actions before running this workflow." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Three invocations rather than one: turbo runs tasks from a single
      # invocation concurrently, and a lint that overlaps a build or a test run
      # in the same package reads the temporary config files those tools write
      # and then delete.
      - name: Lint
        run: pnpm exec turbo run lint --filter=@lifedeck/mobile...

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@lifedeck/mobile...

      - name: Test
        run: pnpm exec turbo run test --filter=@lifedeck/mobile...

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait returns as soon as the build is queued. EAS emails the install
      # link when it finishes, and the queue can be long on the free tier, so
      # holding a runner open for it would only burn minutes.
      - name: Queue the build
        working-directory: apps/mobile
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          args="--platform $PLATFORM --profile $PROFILE --non-interactive --no-wait"
          if [ "$SUBMIT" = "true" ]; then
            args="$args --auto-submit"
          fi
          # shellcheck disable=SC2086
          eas build $args
