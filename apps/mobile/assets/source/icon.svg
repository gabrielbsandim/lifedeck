  <g transform="translate(512 512) scale(23.8) translate(-17.5 -16.5)">
    <rect x="13" y="4" width="15" height="20" rx="4.5" fill="#ffffff" opacity="0.42" />
    <rect x="10" y="6.5" width="15" height="20" rx="4.5" fill="#ffffff" opacity="0.72" />
    <rect x="7" y="9" width="15" height="20" rx="4.5" fill="#ffffff" />
    <circle cx="12" cy="14.5" r="2.4" fill="#b96fe6" />
  </g>
</svg>
