<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Android status bar icon. Android keeps only the alpha channel and tints
       the result, so this is white on transparent and drawn as outlines: three
       filled cards would collapse into one solid blob at 24dp. -->
  <g
    transform="translate(48 48) scale(3.2) translate(-17.5 -16.5)"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.7"
  >
    <rect x="13" y="4" width="15" height="20" rx="4.5" opacity="0.5" />
    <rect x="10" y="6.5" width="15" height="20" rx="4.5" opacity="0.75" />
    <rect x="7" y="9" width="15" height="20" rx="4.5" />
  </g>
</svg>
