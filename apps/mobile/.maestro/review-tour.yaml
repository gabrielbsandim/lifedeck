# Walks the main features for the App Review screen recording. iOS has no back
# key, so an edge swipe leaves each screen.
appId: ${MAESTRO_APP_ID}
name: Review tour
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: onboarding-name
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: onboarding-name
- inputText: Alex
- tapOn:
    id: onboarding-start
- extendedWaitUntil:
    visible:
      id: add-task-input
    timeout: 30000
- tapOn:
    id: add-task-input
- inputText: Buy groceries
- tapOn:
    id: add-task-submit
- extendedWaitUntil:
    visible:
      id: task-checkbox
    timeout: 15000
- tapOn:
    id: add-task-input
- inputText: Call the dentist
- tapOn:
    id: add-task-submit
- hideKeyboard
- tapOn:
    id: task-checkbox
    index: 0
- swipe:
    direction: UP
    duration: 1500
- tapOn: Lists
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: Assistant
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: tab-profile
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: Habits
- tapOn: Habits
- waitForAnimationToEnd:
    timeout: 4000
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 400
- runFlow:
    when:
      visible: Analytics
    commands:
      - tapOn: Analytics
      - waitForAnimationToEnd:
          timeout: 4000
      - swipe:
          start: 1%, 50%
          end: 90%, 50%
          duration: 400
- tapOn:
    id: settings-account
- scrollUntilVisible:
    element:
      id: delete-account
- tapOn:
    id: delete-account
- waitForAnimationToEnd
- tapOn:
    id: delete-account-confirm
- extendedWaitUntil:
    visible:
      id: onboarding-name
    timeout: 30000
