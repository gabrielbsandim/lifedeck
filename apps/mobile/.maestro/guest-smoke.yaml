# The bundle id differs per platform, so the release job passes it in.
appId: ${MAESTRO_APP_ID}
name: Guest smoke
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# A cold start waits on the session request before the form renders.
- extendedWaitUntil:
    visible:
      id: onboarding-name
    timeout: 30000
- tapOn:
    id: onboarding-name
- inputText: Maestro
- tapOn:
    id: onboarding-start
- extendedWaitUntil:
    visible:
      id: add-task-input
    timeout: 30000
- tapOn:
    id: add-task-input
- inputText: Smoke test task
- tapOn:
    id: add-task-submit
- extendedWaitUntil:
    visible:
      id: task-checkbox
    timeout: 15000
- tapOn:
    id: task-checkbox
# XCUITest exposes no checked state, so only Android can assert it.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: task-checkbox
          checked: true
# The tab bar hides while the add-task keyboard is up.
- hideKeyboard
- tapOn:
    id: tab-profile
- tapOn:
    id: settings-account
# Deleting the guest is the cleanup too: the build talks to production.
- scrollUntilVisible:
    element:
      id: delete-account
- tapOn:
    id: delete-account
- tapOn:
    id: delete-account-confirm
- extendedWaitUntil:
    visible:
      id: onboarding-name
    timeout: 30000
